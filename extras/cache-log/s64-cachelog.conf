# Exact Redis page-cache verdict per request (gridpane-nginx-marketing-params, extras/cache-log).
# GridPane's we_log only has $upstream_cache_status, which srcache never sets, so a Redis HIT,
# MISS or BYPASS cannot be told apart there. Installed by extras/cache-log/install.sh into
# /etc/nginx/conf.d/; enabled per site by /var/www/<site>/nginx/s64-cachelog-main-context.conf.
# Fields: time ip method status request_time fetch store skip=<GridPane $skip_reason>
#         dnc=<Do-Not-Cache response header> bytes "uri" "php_time" "user_agent"
log_format s64cache '$time_iso8601 $remote_addr $request_method $status $request_time $srcache_fetch_status $srcache_store_status skip=$skip_reason dnc=$upstream_http_do_not_cache $body_bytes_sent "$request_uri" "$upstream_response_time" "$http_user_agent"';
