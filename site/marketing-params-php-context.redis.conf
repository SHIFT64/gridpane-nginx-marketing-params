# Marketing params ignored by the Redis page cache - ON for this site (with
# marketing-params-skip-redis-cache-context.conf). Use ./install.sh --disable <site> to switch off.
# "r:" + the site's name ties this Redis switch to the site's own Redis flag: the engine
# ignores a pair of two sites (GridPane's add-on-domain overlays include another site's files)
# or of two cache types (a staging push can leave the other type's files behind).
# Exact-name glob: if the engine is not installed on this server, this does nothing.
set $gp_mkt_sw "r:@SITE@";
include /etc/nginx/marketing-params/php-context-redis[.]conf;
