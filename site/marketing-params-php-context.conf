# Marketing params ignored by the FastCGI page cache - ON for this site (with
# marketing-params-skip-fcgi-cache-context.conf). Use ./install.sh --disable <site> to switch off.
# "f:" + the site's name ties this FastCGI switch to the site's own FastCGI flag: the engine
# ignores a pair of two sites (GridPane's add-on-domain overlays include another site's files)
# or of two cache types (a staging push can leave the other type's files behind).
# Exact-name glob: if the engine is not installed on this server, this does nothing.
set $gp_mkt_sw "f:@SITE@";
include /etc/nginx/marketing-params/php-context-fcgi[.]conf;
