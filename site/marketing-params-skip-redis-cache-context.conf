# Marketing params ignored by the Redis page cache - Redis flag for this site.
# GridPane includes *-skip-redis-cache-context.conf only in its Redis page-cache template,
# so this marks the vhost as Redis-cached. Works together with the Redis switch
# marketing-params-php-context.conf of the SAME site; either file alone does nothing.
# Only `set` here: GridPane's server-level code also runs inside srcache's subrequests.
set $gp_mkt_redis "@SITE@";
