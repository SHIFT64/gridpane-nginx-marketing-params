# Marketing params ignored by the FastCGI cache - FastCGI flag for this site.
# GridPane includes *skip-fcgi-cache-context.conf only in its FastCGI cache template,
# so this marks the vhost as FastCGI-cached. Works together with
# marketing-params-php-context.conf; either file alone does nothing.
set $gp_mkt_fcgi 1;
