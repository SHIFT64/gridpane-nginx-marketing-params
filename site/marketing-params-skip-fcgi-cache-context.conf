# Marketing params ignored by the FastCGI page cache - FastCGI flag for this site.
# GridPane includes *skip-fcgi-cache-context.conf only in its FastCGI cache template,
# so this marks the vhost as FastCGI-cached. Works together with the switch
# marketing-params-php-context.conf of the SAME site; either file alone does nothing.
set $gp_mkt_fcgi "@SITE@";
