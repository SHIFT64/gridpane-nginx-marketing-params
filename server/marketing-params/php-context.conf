# #
# Marketing params ignored by the GridPane FastCGI cache - php location logic.
# Included from the per-site switch /var/www/<site>/nginx/marketing-params-php-context.conf
# Acts only together with the FastCGI flag /var/www/<site>/nginx/marketing-params-skip-fcgi-cache-context.conf
# (GridPane includes *skip-fcgi-cache-context.conf only in its FastCGI template, so on a
# Redis / no-cache vhost this file stays inert even if the switch is left behind).
#
# The whole decision happens HERE, i.e. after every server-level skip rule
# (GridPane's and your own) and after every rewrite, right before PHP is called.
# Un-skips only if GridPane's ONLY skip reason is the query string, the method
# is GET/HEAD, $args are still the original query and every param is on the
# list. Otherwise everything below is a no-op (stock GridPane behaviour).
#
# When un-skipped:
#  - cache key = clean path   -> /about-us/?gclid=1 shares the entry of /about-us/
#                                (byte-identical to the stock key, purges keep working)
#  - PHP sees the clean URL    -> nothing like gclid=... gets baked into cached HTML
#  - 3xx Location gets the original params back (same host only), so WordPress
#    redirects (trailing slash, www->apex, canonical, 404 guess) keep gclid/utm
#  - the browser URL is never touched (no redirect is added)
#
# No `if` here on purpose: `if` in a location silently drops `try_files $uri =404`.
# #

# Declare GridPane's variables (no-op at runtime) so this file can never make
# `nginx -t` fail, whatever cache type the vhost uses.
set $skip_cache  $skip_cache;
set $skip_reason $skip_reason;

set $gp_mkt_sc     $skip_cache;
set $gp_mkt_sr     $skip_reason;
set $gp_mkt_in     "$gp_mkt_fcgi|$skip_reason|$request_method|$gp_mkt_qs#$args";
set $gp_mkt_unskip $gp_mkt_verdict;
set $skip_cache    $gp_mkt_skip_cache;
set $skip_reason   $gp_mkt_skip_reason;
set $args          $gp_mkt_args;

fastcgi_cache_key "$scheme$request_method$host$gp_mkt_key_uri";
fastcgi_param REQUEST_URI $gp_mkt_request_uri if_not_empty;

# Keep relative Locations relative although Location is rewritten below (headers-more
# would otherwise make nginx absolutize every relative 3xx Location of this location).
absolute_redirect off;
more_set_headers -s '301 302 303 307 308' 'Location: $gp_mkt_location';
more_set_headers 'X-Grid-Cache-Mkt: $gp_mkt_header';

# Debug (uncomment to see the effective cache key):
#more_set_headers 'X-Grid-Cache-Key: $scheme$request_method$host$gp_mkt_key_uri';
