# #
# Marketing params ignored by the GridPane FASTCGI page cache - php location logic.
# Included from the per-site FastCGI switch /var/www/<site>/nginx/marketing-params-php-context.conf
# Acts only together with the FastCGI flag /var/www/<site>/nginx/marketing-params-skip-fcgi-cache-context.conf
#
# The key below is GridPane's stock formula with the clean path when un-skipped, and exactly
# the stock key otherwise. It is set for every request of the site, so install.sh refuses
# sites whose FastCGI key differs (GeoIP and other customised keys). Only the FastCGI switch
# includes this file: a Redis switch left on a FastCGI vhost never touches the key.
# #

include /etc/nginx/marketing-params/php-context[.]conf;

fastcgi_cache_key "$scheme$request_method$host$gp_mkt_key_uri";

# Debug (uncomment to see the effective cache key):
#more_set_headers 'X-Grid-Cache-Key: $scheme$request_method$host$gp_mkt_key_uri';
