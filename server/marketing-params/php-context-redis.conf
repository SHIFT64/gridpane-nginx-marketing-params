# #
# Marketing params ignored by the GridPane REDIS page cache - php location logic.
# Included from the per-site Redis switch /var/www/<site>/nginx/marketing-params-php-context.conf
# Acts only together with the Redis flag /var/www/<site>/nginx/marketing-params-skip-redis-cache-context.conf
#
# GridPane's Redis template computes, in its php location and BEFORE including the
# site's *-php-context.conf files:
#     set $key "dbN:$scheme$request_method$host$request_uri";
#     set_escape_uri $escaped_key $key;
# srcache_fetch reads $key and srcache_store reads $escaped_key only later (access
# phase / output filter), so both are recomputed here, after the decision.
#
# When un-skipped, $key becomes the clean URL's stock key with the site's own dbN:
# prefix: /about-us/?gclid=1 shares the entry of /about-us/, and Nginx Helper's
# per-URL purge (dbN:httpsGET<host>/about-us/) and GridPane's purges still clear it.
# Otherwise $key is left exactly as GridPane computed it. If $key does not have the
# stock formula (GeoIP variant, customised key), nothing is un-skipped at all.
# #

# $key is referenced only here, never in the engine: a server without any Redis vhost
# has no $key at all. (This file also sets $key, so it always declares it.)
# $gp_mkt_sw (the site's name) is set by the per-site switch right before this include.
set $gp_mkt_k   $key;
include /etc/nginx/marketing-params/php-context[.]conf;

set $key $gp_mkt_rkey;
set_escape_uri $escaped_key $key;

# Debug (uncomment to see the effective cache key):
#more_set_headers 'X-Grid-Cache-Key: $key';
